<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BaileyAI</title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >
</head>

<body>
    <div
        id="termsModal"
        class="modal"
    >
        <div class="modal-content">
            <h2>BaileyAI</h2>

            <p>
                By continuing, you consent to microphone access and
                AI-generated voice interaction for testing purposes.
            </p>

            <button
                id="acceptTerms"
                class="primary-button"
            >
                Accept & Continue
            </button>
        </div>
    </div>

    <main
        id="appContainer"
        class="app-container hidden"
    >
        <h1>BaileyAI</h1>

        <p
            id="status"
            class="status"
        >
            Preparing Bailey...
        </p>

        <button
            id="microphoneButton"
            class="microphone-button"
            type="button"
            disabled
            aria-label="Start or stop recording"
        >
            <span id="microphoneIcon">🎤</span>
        </button>

        <p
            id="instruction"
            class="instruction"
        >
            Please wait while Bailey loads.
        </p>

        <div
            id="pulseContainer"
            class="pulse-container hidden"
            aria-hidden="true"
        >
            <span></span>
            <span></span>
            <span></span>
        </div>

        <section class="conversation-preview">
            <p
                id="transcript"
                class="transcript"
            ></p>

            <p
                id="assistant"
                class="assistant"
            ></p>
        </section>

        <button
            id="resetConversation"
            class="secondary-button"
            type="button"
            disabled
        >
            New Conversation
        </button>
    </main>

    <script
        type="module"
        src="/static/js/main.js"
    ></script>
</body>
</html>
